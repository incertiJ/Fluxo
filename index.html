<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>Minhas Tarefas</title>
</head>
<body>
  <header class="app-header">
    <h1>Minhas Tarefas</h1>
    <button id="install-btn" class="install-btn" hidden>Instalar</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="today" role="tab">Hoje</button>
    <button class="tab" data-view="upcoming" role="tab">Próximas</button>
    <button class="tab" data-view="routines" role="tab">Rotinas</button>
    <button class="tab" data-view="done" role="tab">Concluídas</button>
  </nav>

  <main id="task-list" class="task-list" aria-live="polite"></main>

  <button id="add-btn" class="fab" aria-label="Adicionar tarefa">+</button>

  <div id="modal" class="modal" hidden>
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="modal-title">Nova tarefa</h2>
        <button id="close-modal" class="icon-btn" aria-label="Fechar">×</button>
      </header>

      <form id="task-form" class="task-form">
        <div class="voice-row">
          <button type="button" id="mic-btn" class="mic-btn" aria-label="Gravar áudio">
            <span class="mic-icon">🎤</span>
            <span class="mic-label">Falar</span>
          </button>
          <span id="mic-status" class="mic-status"></span>
        </div>

        <label class="field">
          <span>Título</span>
          <input type="text" id="title" required maxlength="200" placeholder="Ex: Tomar água">
        </label>

        <label class="field">
          <span>Descrição (opcional)</span>
          <textarea id="description" rows="2" maxlength="1000"></textarea>
        </label>

        <fieldset class="field">
          <legend>Tipo</legend>
          <label class="radio">
            <input type="radio" name="type" value="oneoff" checked>
            <span>Pontual</span>
          </label>
          <label class="radio">
            <input type="radio" name="type" value="routine">
            <span>Rotineira</span>
          </label>
        </fieldset>

        <div id="oneoff-fields" class="type-fields">
          <label class="field">
            <span>Data e hora limite</span>
            <input type="datetime-local" id="deadline">
          </label>

          <fieldset class="field">
            <legend>Subtarefas</legend>
            <ul id="subtasks-list" class="subtasks-list"></ul>
            <div class="row">
              <input type="text" id="new-subtask" placeholder="Nova subtarefa" maxlength="200">
              <button type="button" id="add-subtask-btn" class="ghost-btn">Adicionar</button>
            </div>
          </fieldset>
        </div>

        <div id="routine-fields" class="type-fields" hidden>
          <label class="field">
            <span>Frequência</span>
            <select id="recurrence-type">
              <option value="daily">Todos os dias</option>
              <option value="weekly">Semanal</option>
              <option value="monthly">Mensal</option>
            </select>
          </label>

          <fieldset id="weekly-fields" class="field" hidden>
            <legend>Dias da semana</legend>
            <div class="weekdays">
              <label class="chip"><input type="checkbox" value="0"><span>Dom</span></label>
              <label class="chip"><input type="checkbox" value="1"><span>Seg</span></label>
              <label class="chip"><input type="checkbox" value="2"><span>Ter</span></label>
              <label class="chip"><input type="checkbox" value="3"><span>Qua</span></label>
              <label class="chip"><input type="checkbox" value="4"><span>Qui</span></label>
              <label class="chip"><input type="checkbox" value="5"><span>Sex</span></label>
              <label class="chip"><input type="checkbox" value="6"><span>Sáb</span></label>
            </div>
          </fieldset>

          <label id="monthly-field" class="field" hidden>
            <span>Dia do mês</span>
            <input type="number" id="day-of-month" min="1" max="31" value="1">
          </label>

          <label class="field">
            <span>Horário</span>
            <input type="time" id="routine-time" value="09:00">
          </label>
        </div>

        <fieldset class="field">
          <legend>Notificações</legend>
          <ul id="notifications-list" class="notifications-list"></ul>
          <div class="row">
            <input type="number" id="notif-amount" min="0" max="9999" value="10">
            <select id="notif-unit">
              <option value="minutes">minutos antes</option>
              <option value="hours">horas antes</option>
              <option value="days">dias antes</option>
              <option value="weeks">semanas antes</option>
            </select>
            <button type="button" id="add-notif-btn" class="ghost-btn">Adicionar</button>
          </div>
          <p class="hint">As notificações funcionam com o app aberto ou em segundo plano. Para uso confiável no celular, instale como app e mantenha permissões ativas.</p>
        </fieldset>

        <div class="modal-actions">
          <button type="button" id="delete-btn" class="danger-btn" hidden>Excluir</button>
          <button type="submit" class="primary-btn">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="./app.js" type="module"></script>
</body>
</html>
